name: Sync current period from TLDP-Management

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-current-period
  cancel-in-progress: false

jobs:
  sync:
    name: Pull current-period.md from Management
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TLDP-Public
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Checkout private TLDP-Management
        uses: actions/checkout@v4
        with:
          repository: danangwijaya03/TLDP-Management
          ref: main
          token: ${{ secrets.TLDP_MANAGEMENT_TOKEN }}
          path: source
          persist-credentials: false

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          test -s source/current-period.md

      - name: Sync to public root
        shell: bash
        run: |
          set -euo pipefail
          cp source/current-period.md current-period.md

          if git diff --quiet -- current-period.md; then
            echo "Public current-period.md is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- current-period.md
          git commit -m "Sync current-period.md from TLDP-Management"
          git push origin HEAD:main
